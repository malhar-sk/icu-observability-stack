services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.155.0
    command:
      # Persist data in the mounted volume (the image default path is not /storage).
      - "-storageDataPath=/storage"
      # Default is 30s, which hides new devices and delays offline detection.
      - "-search.latencyOffset=5s"
    ports:
      - "8428:8428"
    volumes:
      - vm_data:/storage

  grafana:
    image: grafana/grafana:13.3.0
    ports:
      - "3000:3000"
    environment:
      # Open the fleet dashboard on login.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/device-fleet.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"

  # MQTT input (optional): boards that speak MQTT publish to fleet/<device_id>/<metric> and show up like any
  # other device. Off by default. Start with `./fleet up --mqtt` (bundled broker) or
  # `./fleet up --mqtt-broker HOST` (a broker you already run); both write the settings below to .env.
  mosquitto:
    profiles: ["mqtt"]
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    ports:
      - "1883:1883"
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME-fleet}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -n "$$MQTT_PASSWORD" ] || { echo "MQTT_PASSWORD is empty: start the broker with ./fleet up --mqtt" >&2; exit 1; }
        mosquitto_passwd -b -c /mosquitto/passwd "$$MQTT_USERNAME" "$$MQTT_PASSWORD"
        printf 'user %s\ntopic readwrite fleet/#\n' "$$MQTT_USERNAME" > /mosquitto/acl
        chown mosquitto:mosquitto /mosquitto/passwd /mosquitto/acl  # the broker drops to this user before reading them
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data

  mqtt-bridge:
    profiles: ["mqtt", "mqtt-bridge"]
    build: ./bridge
    image: icu-mqtt-bridge:local
    restart: unless-stopped
    environment:
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME-fleet}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      VM_URL: http://victoriametrics:8428

  # Watcher (optional): checks things that cannot run the agent (a ping, a port, a web page, a metrics endpoint such
  # as ESPHome's) and reports them as devices. Off by default. `./fleet watch add ...` turns it on (it adds the profile
  # to .env) and manages the target list in ./watch/targets.json. Runs the stock Python image: nothing to build.
  watcher:
    profiles: ["watch"]
    image: python:3.13-alpine
    restart: unless-stopped
    command: ["python", "-u", "/app/watcher.py"]
    environment:
      VM_URL: http://victoriametrics:8428
      TARGETS_FILE: /watch/targets.json
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./watcher:/app:ro
      - ./watch:/watch:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW  # for ping

  # Not started by default: this demo pipeline is currently broken (the image reads
  # /etc/vector/vector.yaml, and the config wires log events into a metrics sink).
  # Start explicitly with: docker compose --profile legacy-vector up -d
  vector:
    profiles: ["legacy-vector"]
    image: timberio/vector:0.61.0-debian
    volumes:
      - ./vector.toml:/etc/vector/vector.toml
    ports:
      - "8686:8686"

volumes:
  vm_data:
  grafana_data:
  mosquitto_data:
