# One Grafana-managed alert rule, one alert instance per device_id.
# Semantics are fixed by docs/CONTRACT.md: age = time() - tlast_over_time(device_uptime_seconds[1d]),
# OFFLINE when age > max(30 s, 3 x the device's own device_report_interval_seconds), 'for: 30s',
# evaluated every 10 s. A device that declares no interval is held to 30 s.
#
# Deliberately NOT provisioned: contact point and notification policy (none is configured;
# alert state is visible in Grafana Alerting and through its API).
apiVersion: 1

groups:
  - orgId: 1
    name: device-health
    folder: Device Fleet
    interval: 10s
    rules:
      - uid: device-offline
        title: DeviceOffline
        condition: C
        for: 30s
        # A device that never reported is invisible (no series), so no data is not an alert.
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          severity: critical
        annotations:
          summary: 'Device {{ $labels.device_id }} has not reported for {{ printf "%.0f" $values.B.Value }} s (it is offline after {{ printf "%.0f" $values.M.Value }} s of silence)'
        data:
          # A: seconds since the last device_uptime_seconds sample, one series per device_id
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              refId: A
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: max by (device_id) (time() - tlast_over_time(device_uptime_seconds[1d]))
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          # L: seconds of silence after which each device counts as OFFLINE: 3 x the interval it declares
          # (never below 30 s); 30 s for a device that declares none
          - refId: L
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              refId: L
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: (clamp_min(3 * max by (device_id) (last_over_time(device_report_interval_seconds[1d])), 30) or (0 * max by (device_id) (time() - tlast_over_time(device_uptime_seconds[1d])) + 30))
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          # B: reduce each series to a number
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              datasource:
                type: __expr__
                uid: __expr__
          # M: the same for the limit
          - refId: M
            datasourceUid: __expr__
            model:
              refId: M
              type: reduce
              expression: L
              reducer: last
              settings:
                mode: dropNN
              datasource:
                type: __expr__
                uid: __expr__
          # C: fires (1) when a device has been silent for longer than its own limit
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: math
              expression: $B > $M
              datasource:
                type: __expr__
                uid: __expr__
