# Broker settings for `./fleet up --mqtt` (see docker-compose.yml, service "mosquitto").
# The user name and password come from .env; the container writes the password file and the ACL at start.
# Plain MQTT (no TLS), like the rest of this stack: keep it on a network you trust.
listener 1883
allow_anonymous false
password_file /mosquitto/passwd
acl_file /mosquitto/acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout
